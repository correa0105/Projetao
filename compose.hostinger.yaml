name: alvorada-cinzenta-hostinger

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: alvorada_cinzenta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure .env.hostinger}
      POSTGRES_DB: alvorada_cinzenta
    ports:
      # Optional local illustrator access through an SSH tunnel; never public.
      - '127.0.0.1:5436:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U alvorada_cinzenta -d alvorada_cinzenta']
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  app:
    image: ${ALVORADA_IMAGE:-alvorada-cinzenta:hostinger}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://alvorada_cinzenta:${POSTGRES_PASSWORD}@db:5432/alvorada_cinzenta
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Configure .env.hostinger}
      BETTER_AUTH_URL: https://${SITE_HOST:?Configure SITE_HOST}
      APP_ORIGIN: https://${SITE_HOST:?Configure SITE_HOST}
      APP_SHARE_ORIGIN: https://${SITE_HOST:?Configure SITE_HOST}
      TRUST_REVERSE_PROXY: '1'
      PORT: '3000'
      VTT_TRANSLATOR_URL: http://translator:5000
    # Only Caddy can receive public requests; do not publish the app's port.
    volumes:
      - ./data/vtt/premium-art:/app/data/vtt/premium-art:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
    logging: *logging

  proxy:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      SITE_HOST: ${SITE_HOST:?Configure SITE_HOST}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/hostinger/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging

  translator:
    image: libretranslate/libretranslate@sha256:1de2d7056bb8ad607a412f4563d9abe324ff632b43b5be9428bcc8e213aebb32
    restart: unless-stopped
    environment:
      LT_LOAD_ONLY: en,pt
      LT_CHAR_LIMIT: '40000'
      LT_BATCH_LIMIT: '100'
      LT_DISABLE_WEB_UI: 'true'
      LT_DISABLE_FILES_TRANSLATION: 'true'
    volumes:
      - translator_models:/home/libretranslate/.local
    logging: *logging

volumes:
  postgres_data:
  translator_models:
  caddy_data:
  caddy_config:
