<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <!-- Procedural cloud texture; no external artwork or runtime dependencies. -->
    <filter id="clouds" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".008 .013" numOctaves="5" seed="17"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .86  0 0 0 0 .90  0 0 0 0 .94  3.8 0 0 0 -1.5"/>
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <radialGradient id="fade">
      <stop stop-color="white" stop-opacity=".95"/>
      <stop offset=".48" stop-color="white" stop-opacity=".65"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <mask id="banks">
      <ellipse cx="340" cy="340" rx="330" ry="270" fill="url(#fade)"/>
      <ellipse cx="760" cy="410" rx="440" ry="270" fill="url(#fade)"/>
      <ellipse cx="980" cy="260" rx="220" ry="240" fill="url(#fade)"/>
    </mask>
  </defs>
  <path d="M0 0h1200v800H0z" filter="url(#clouds)" mask="url(#banks)"/>
</svg>
