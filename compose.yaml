name: alvorada-cinzenta
services:
  db:
    container_name: alvorada-cinzenta-db
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: alvorada_cinzenta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}
      POSTGRES_DB: alvorada_cinzenta
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alvorada_cinzenta -d alvorada_cinzenta"]
      interval: 5s
      timeout: 5s
      retries: 15
  app:
    container_name: alvorada-cinzenta-app
    image: alvorada-cinzenta-app:local
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://alvorada_cinzenta:${POSTGRES_PASSWORD}@db:5432/alvorada_cinzenta
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Configure BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
  pgweb:
    container_name: alvorada-cinzenta-sql
    image: sosedoff/pgweb@sha256:a5256d416e2e8b92d69a4459058e3eca33a9f075d8325491644411d0bc3bd70b
    profiles: ["tools"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGWEB_DATABASE_URL: postgresql://alvorada_cinzenta:${POSTGRES_PASSWORD}@db:5432/alvorada_cinzenta?sslmode=disable
    command: ["--bind=0.0.0.0", "--listen=8081", "--skip-open", "--readonly", "--lock-session"]
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8081"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
